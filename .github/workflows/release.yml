name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: mv dist WSync-LED
      - run: zip -r WSync-LED.zip WSync-LED

      - uses: softprops/action-gh-release@v2
        with:
          files: WSync-LED.zip