name: Translations

on:
  push:
    branches:
      - dev
      - main
      - translation

  pull_request:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run prebuild

      - run: npm run sort-translations